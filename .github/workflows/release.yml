name: Release Packaging & Draft Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0-rc.1)'
        required: true
        default: '1.0.0-rc.1'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Installer & Release Package (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Version
        shell: powershell
        run: |
          $ver = "1.0.0-rc.1"
          if ("${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          Write-Host "Resolved Release Version: $ver" -ForegroundColor Green
          "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Configure CMake (x64 Release)
        shell: powershell
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Native Binaries
        shell: powershell
        run: |
          cmake --build build --config Release --parallel

      - name: Execute Full Pre-Release Regression Quality Gate
        shell: powershell
        run: |
          Write-Host "==> Running full regression test suite prior to release packaging..." -ForegroundColor Cyan
          powershell -ExecutionPolicy Bypass -File scripts/run_ci_gate.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Quality gate failed with exit code $LASTEXITCODE. Release packaging ABORTED."
          }

      - name: Compile Inno Setup Installer via Build Script
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Version "${{ env.RELEASE_VERSION }}" -ReuseExistingBinaries
          if (-not (Test-Path "out/installer/PersonalIME-Setup-x64.exe")) {
            throw "Installer build failed: out/installer/PersonalIME-Setup-x64.exe not found."
          }

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          $pkgDir = "out/portable_staging"
          New-Item -ItemType Directory -Path "$pkgDir/manager" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/dictionaries" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/scripts" -Force | Out-Null
          New-Item -ItemType Directory -Path "out/release" -Force | Out-Null

          Copy-Item "build/Release/PersonalIME.dll" -Destination "$pkgDir/"
          Copy-Item "build/Release/ime-service.exe" -Destination "$pkgDir/"
          Copy-Item "build/Release/ime-cli.exe" -Destination "$pkgDir/"
          Copy-Item "LICENSE" -Destination "$pkgDir/"
          Copy-Item "README.md" -Destination "$pkgDir/"
          Copy-Item "data/dictionaries/*.dict" -Destination "$pkgDir/dictionaries/"
          Copy-Item "data/dictionaries/NOTICE.txt" -Destination "$pkgDir/dictionaries/"
          Copy-Item "scripts/register.ps1" -Destination "$pkgDir/scripts/"
          Copy-Item "scripts/unregister.ps1" -Destination "$pkgDir/scripts/"
          Copy-Item "out/publish/manager/*" -Destination "$pkgDir/manager/" -Recurse

          Compress-Archive -Path "$pkgDir/*" -DestinationPath "out/release/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip" -Force
          Copy-Item "out/installer/PersonalIME-Setup-x64.exe" -Destination "out/release/"

      - name: Compute SHA256 Checksums
        shell: powershell
        run: |
          $artifacts = Get-ChildItem -Path "out/release" -File
          $sums = @()
          foreach ($a in $artifacts) {
            $h = (Get-FileHash -Algorithm SHA256 $a.FullName).Hash
            $sums += "$h  $($a.Name)"
            Write-Host "$h  $($a.Name)" -ForegroundColor Cyan
          }
          $sums | Out-File -FilePath "out/release/SHA256SUMS.txt" -Encoding ascii

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          draft: true
          prerelease: true
          name: "Personal IME v${{ env.RELEASE_VERSION }}"
          tag_name: "v${{ env.RELEASE_VERSION }}"
          files: |
            out/release/PersonalIME-Setup-x64.exe
            out/release/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip
            out/release/SHA256SUMS.txt
          body: |
            ## Personal IME Release Candidate v${{ env.RELEASE_VERSION }}
            
            ### 产物清单 (Artifacts)
            - **标准安装包 (Inno Setup)**: `PersonalIME-Setup-x64.exe`
            - **绿色便携包 (Portable Archive)**: `PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip`
            - **校验和文件 (Checksums)**: `SHA256SUMS.txt`
            
            ### 架构与运行环境 (Architecture Scope)
            - **操作系统**: Windows 10 / Windows 11 (仅限 64 位 x64 / AMD64)
            - **32位宿主 (x86/WOW64)**: 首发候选版本未包含 32 位二进制，不支持 32 位宿主应用。
            
            ### 代码签名与安全说明 (Code Signing Status)
            > [!WARNING]
            > **未签名二进制提示 (Unsigned Notice)**:
            > 本候选版本产物目前**未附加商业数字签名证书**。
            > Windows SmartScreen 或浏览器下载时可能会提示“未知发布者”或安全警告。这是未签名开源二进制的正常安全策略，点击“更多信息” -> “仍要运行”即可。
            
            ### 快速启用与安装说明 (How to Enable)
            1. **方式 A (安装包推荐)**:
               - 运行 `PersonalIME-Setup-x64.exe`，按向导安装到机器目录（默认 `{autopf}\PersonalIME`）。
               - 首次安装后可在 Windows“时间和语言 -> 语言和区域 -> 键盘”中找到“Personal IME (私人输入法)”。
            2. **方式 B (绿色便携免安装)**:
               - 解压 `PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip` 到任意英文或中文路径。
               - 以管理员权限运行 `scripts/register.ps1` 完成 TSF TIP 注册。
               - 启动根目录下 `ime-service.exe` 即可使用。
            
            ### 用户数据与升级保护 (User Data & Data Protection)
            - 个人自造词与配置严格存储在用户上下文的 `%APPDATA%\PersonalIME\user_dict.db`。
            - 安装程序与绿色包注册严格遵守机器与用户隔离，覆盖升级默认无损保留所有历史词库、排序权重和提交收据。
            
            ### 卸载与注销 (Removal & Cleanup)
            - 安装包用户可在 Windows“设置 -> 应用 -> 已安装的应用”中卸载，卸载程序默认保留用户词库。
            - 绿色包用户可在命令行运行 `powershell scripts/unregister.ps1` 彻底注销系统 TSF COM 注册表项。
            
            ### 尚未完成的实机验证与已知限制 (Known Limitations)
            - 统一自动化门禁已在 Windows CI 虚拟机 100% 通过（包含 10 项原生单元测试、负向协议注入、18 项端到端集成测试及 40 项 WPF 管理端测试）。
            - **实机物理打字验收**（在记事本、Edge/Chrome、VS Code、Windows Terminal 中的真实键盘击键、候选浮窗锚定定位与光标跟随）目前处于**待实机验收**状态，详见文档 `docs/stage5-host-acceptance.md`。
            - 当前输入法快捷键：中英直通模式切换为 `Ctrl+Space`，全半角切换为 `Shift+Space`，标点切换为 `Ctrl+.`。
