name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Automated Test Suite (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure CMake (x64 Release)
        shell: powershell
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Native Binaries
        shell: powershell
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unified CI Regression Quality Gate
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/run_ci_gate.ps1

      - name: Host Acceptance Scope Notice
        shell: powershell
        run: |
          Write-Host "==========================================================================" -ForegroundColor Green
          Write-Host "  Automated CI Verification Completed Successfully!                       " -ForegroundColor Green
          Write-Host "==========================================================================" -ForegroundColor Green
          Write-Host "NOTE: CI automates core engines, IPC wire protocol, candidate windows, and" -ForegroundColor Yellow
          Write-Host "mocked TSF lifecycle. Real host text input acceptance (Notepad, Edge," -ForegroundColor Yellow
          Write-Host "Terminal, VS Code) must be performed interactively per:" -ForegroundColor Yellow
          Write-Host "docs/stage5-host-acceptance.md." -ForegroundColor Cyan
