name: CI & Release Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0-rc.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Automated Test Suite (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure CMake (x64 Release)
        shell: powershell
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Native Binaries
        shell: powershell
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unified CI Regression Quality Gate
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/run_ci_gate.ps1

      - name: Host Acceptance Scope Notice
        shell: powershell
        run: |
          Write-Host "==========================================================================" -ForegroundColor Green
          Write-Host "  Automated CI Verification Completed Successfully!                       " -ForegroundColor Green
          Write-Host "==========================================================================" -ForegroundColor Green
          Write-Host "NOTE: CI automates core engines, IPC wire protocol, candidate windows, and" -ForegroundColor Yellow
          Write-Host "mocked TSF lifecycle. Real host text input acceptance (Notepad, Edge," -ForegroundColor Yellow
          Write-Host "Terminal, VS Code) must be performed interactively per:" -ForegroundColor Yellow
          Write-Host "docs/stage5-host-acceptance.md." -ForegroundColor Cyan

  package-and-release:
    name: Package Windows Installer & Publish Release
    needs: build-and-test
    runs-on: windows-latest
    # Only package on push to main, tag push, or manual workflow_dispatch
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: get_version
        shell: powershell
        run: |
          $ver = ""
          if ("${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          } else {
            # Nightly / main build version with commit SHA
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $dateStr = Get-Date -Format "yyyyMMdd"
            $ver = "1.0.0-ci.$dateStr.$shortSha"
          }
          Write-Host "Resolved Target Version: $ver" -ForegroundColor Green
          "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Configure CMake (x64 Release)
        shell: powershell
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Native Binaries
        shell: powershell
        run: |
          cmake --build build --config Release --parallel

      - name: Compile Inno Setup Installer & Publish WPF Manager
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Version "${{ env.RELEASE_VERSION }}" -ReuseExistingBinaries
          if (-not (Test-Path "out/installer/PersonalIME-Setup-x64.exe")) {
            throw "Installer build failed: out/installer/PersonalIME-Setup-x64.exe not found."
          }

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          $pkgDir = "out/portable_staging"
          New-Item -ItemType Directory -Path "$pkgDir/manager" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/dictionaries" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir/scripts" -Force | Out-Null
          New-Item -ItemType Directory -Path "out/release" -Force | Out-Null

          Copy-Item "build/Release/PersonalIME.dll" -Destination "$pkgDir/"
          Copy-Item "build/Release/ime-service.exe" -Destination "$pkgDir/"
          Copy-Item "build/Release/ime-cli.exe" -Destination "$pkgDir/"
          Copy-Item "LICENSE" -Destination "$pkgDir/"
          Copy-Item "README.md" -Destination "$pkgDir/"
          Copy-Item "data/dictionaries/*.dict" -Destination "$pkgDir/dictionaries/"
          Copy-Item "data/dictionaries/NOTICE.txt" -Destination "$pkgDir/dictionaries/"
          Copy-Item "scripts/register.ps1" -Destination "$pkgDir/scripts/"
          Copy-Item "scripts/unregister.ps1" -Destination "$pkgDir/scripts/"
          Copy-Item "out/publish/manager/*" -Destination "$pkgDir/manager/" -Recurse

          Compress-Archive -Path "$pkgDir/*" -DestinationPath "out/release/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip" -Force
          Copy-Item "out/installer/PersonalIME-Setup-x64.exe" -Destination "out/release/"

      - name: Compute SHA256 Checksums
        shell: powershell
        run: |
          $artifacts = Get-ChildItem -Path "out/release" -File
          $sums = @()
          foreach ($a in $artifacts) {
            $h = (Get-FileHash -Algorithm SHA256 $a.FullName).Hash
            $sums += "$h  $($a.Name)"
            Write-Host "$h  $($a.Name)" -ForegroundColor Cyan
          }
          $sums | Out-File -FilePath "out/release/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows Packages to CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PersonalIME-Windows-x64-v${{ env.RELEASE_VERSION }}
          path: |
            out/release/PersonalIME-Setup-x64.exe
            out/release/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip
            out/release/SHA256SUMS.txt
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v') == false }}
          name: "人人 (RenRen IME) v${{ env.RELEASE_VERSION }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}
          files: |
            out/release/PersonalIME-Setup-x64.exe
            out/release/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip
            out/release/SHA256SUMS.txt
          body: |
            ## 人人 (RenRen IME) Windows 发行版 v${{ env.RELEASE_VERSION }}
            
            > **让每个人都能拥有属于自己的输入法，做那个越来越懂你的输入伙伴。**
            
            ### 产物清单 (Artifacts)
            - **标准安装包 (Inno Setup)**: `PersonalIME-Setup-x64.exe`
            - **绿色便携包 (Portable Archive)**: `PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip`
            - **校验和文件 (Checksums)**: `SHA256SUMS.txt`
            
            ### 架构与运行环境 (Architecture Scope)
            - **操作系统**: Windows 10 / Windows 11 (仅限 64 位 x64 / AMD64)
            - **32位宿主 (x86/WOW64)**: 目前未包含 32 位二进制，不支持 32 位宿主应用。
            
            ### 安装与启用说明 (How to Install & Enable)
            1. **方式 A (安装包推荐)**:
               - 下载并运行 `PersonalIME-Setup-x64.exe`，按安装向导完成安装。
               - 在 Windows“设置 -> 时间和语言 -> 语言和区域 -> 键盘”中可选用“人人 (RenRen IME)”。
            2. **方式 B (绿色便携免安装)**:
               - 解压 `PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip` 到任意目录。
               - 以管理员权限运行 `scripts/register.ps1` 完成 TSF 注册。
               - 启动根目录下 `ime-service.exe` 即可使用。
            
            ### 代码签名说明 (Code Signing Status)
            > [!WARNING]
            > 本项目为开源构建产物，尚未附加商业数字签名证书。Windows SmartScreen 下载或首次运行时可能提示“未知发布者”，点击“更多信息” -> “仍要运行”即可。
