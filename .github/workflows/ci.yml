name: CI & Release Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0-rc.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Automated Test Suite (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure CMake (x64 Release)
        shell: powershell
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Native Binaries
        shell: powershell
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unified CI Regression Quality Gate
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/run_ci_gate.ps1

      - name: Host Acceptance Scope Notice
        shell: powershell
        run: |
          Write-Host "==========================================================================" -ForegroundColor Green
          Write-Host "  Automated CI Verification Completed Successfully!                       " -ForegroundColor Green
          Write-Host "==========================================================================" -ForegroundColor Green
          Write-Host "NOTE: CI automates core engines, IPC wire protocol, candidate windows, and" -ForegroundColor Yellow
          Write-Host "mocked TSF lifecycle. Real host text input acceptance (Notepad, Edge," -ForegroundColor Yellow
          Write-Host "Terminal, VS Code) must be performed interactively per:" -ForegroundColor Yellow
          Write-Host "docs/stage5-host-acceptance.md." -ForegroundColor Cyan

  build-and-test-macos:
    name: Build & Automated Test Suite (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Toolchain Versions
        run: |
          cmake --version
          swiftc --version
          uname -m

      - name: Configure CMake (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build ime-core, ime-cli, portable tests and input method bundle
        run: cmake --build build --config Release --parallel

      - name: Run Portable Core Regression Tests
        run: |
          ./build/test_ime_core
          ./build/test_input_policy
          ./build/test_mac_bridge

      - name: Verify macOS Input Method Bundle
        run: |
          test -x build/PersonalIME.app/Contents/MacOS/PersonalIME
          test -f build/PersonalIME.app/Contents/Info.plist
          test -f build/PersonalIME.app/Contents/PkgInfo
          test "$(cat build/PersonalIME.app/Contents/PkgInfo)" = "APPL????"
          test -d build/PersonalIME.app/Contents/Resources/dictionaries
          /usr/libexec/PlistBuddy -c "Print :InputMethodConnectionName" build/PersonalIME.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :InputMethodServerControllerClass" build/PersonalIME.app/Contents/Info.plist
          codesign --verify --verbose build/PersonalIME.app
          echo "--- universal binary check ---"
          lipo -info build/PersonalIME.app/Contents/MacOS/PersonalIME
          lipo -info build/PersonalIME.app/Contents/MacOS/PersonalIME | grep -q "x86_64 arm64\|arm64 x86_64" \
            || { echo "ERROR: PersonalIME is not a universal binary"; exit 1; }

      - name: Host Acceptance Scope Notice (macOS)
        run: |
          echo "=========================================================================="
          echo "  macOS automated verification completed successfully."
          echo "=========================================================================="
          echo "NOTE: CI validates the portable core, the IMK bundle structure, code"
          echo "signature and engine startup. Real host acceptance (installing the"
          echo "input method into ~/Library/Input Methods and typing in TextEdit)"
          echo "must be performed interactively on a Mac."

      - name: Package macOS DMG
        run: |
          mkdir -p build/dist
          DMG="build/dist/PersonalIME-macOS.dmg"
          hdiutil create -volname "PersonalIME" -srcfolder build/PersonalIME.app \
            -ov -format UDZO "${DMG}"
          shasum -a 256 "${DMG}" > build/dist/SHA256SUMS-macOS.txt
          cat build/dist/SHA256SUMS-macOS.txt

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: PersonalIME-macOS-app
          path: build/PersonalIME.app
          retention-days: 14

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: PersonalIME-macOS-dmg
          path: |
            build/dist/PersonalIME-macOS.dmg
            build/dist/SHA256SUMS-macOS.txt
          retention-days: 14

  package-and-release:
    name: Package Windows Installer & Publish Release
    needs: build-and-test
    runs-on: windows-latest
    # Only package on push to main, tag push, or manual workflow_dispatch
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: get_version
        shell: powershell
        run: |
          $ver = ""
          if ("${{ github.event.inputs.version }}" -ne "") {
            $ver = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          } else {
            # Nightly / main build version with commit SHA
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $dateStr = Get-Date -Format "yyyyMMdd"
            $ver = "1.0.0-ci.$dateStr.$shortSha"
          }
          Write-Host "Resolved Target Version: $ver" -ForegroundColor Green
          "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Configure CMake (x64 Release)
        shell: powershell
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Native Binaries
        shell: powershell
        run: |
          cmake --build build --config Release --parallel

      - name: Compile Inno Setup Installer & Publish WPF Manager
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -Version "${{ env.RELEASE_VERSION }}" -ReuseExistingBinaries
          if (-not (Test-Path "out/installer/PersonalIME-Setup-x64.exe")) {
            throw "Installer build failed: out/installer/PersonalIME-Setup-x64.exe not found."
          }

      - name: Package Release Artifacts & Portable ZIP
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_release.ps1 -Version "${{ env.RELEASE_VERSION }}"

      - name: Upload Windows Packages to CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PersonalIME-Windows-x64-v${{ env.RELEASE_VERSION }}
          path: |
            out/release/PersonalIME-Setup-x64.exe
            out/release/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip
            out/release/SHA256SUMS.txt
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          draft: false
          prerelease: false
          make_latest: true
          name: "人人 (RenRen IME) v${{ env.RELEASE_VERSION }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}
          files: |
            out/release/PersonalIME-Setup-x64.exe
            out/release/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip
            out/release/SHA256SUMS.txt
          body: |
            ## 人人 (RenRen IME) Windows 发行版 v${{ env.RELEASE_VERSION }}
            
            > **让每个人都能拥有属于自己的输入法，做那个越来越懂你的输入伙伴。**
            
            ### 产物清单与直接下载 (Artifacts & Direct Downloads)
            - 📦 **标准安装包 (推荐向导安装)**: [PersonalIME-Setup-x64.exe](https://github.com/maifeipin/PersonalIME/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}/PersonalIME-Setup-x64.exe)
            - 🗜️ **绿色便携包 (解压即用免安装)**: [PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip](https://github.com/maifeipin/PersonalIME/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}/PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip)
            - 📄 **哈希校验和**: [SHA256SUMS.txt](https://github.com/maifeipin/PersonalIME/releases/download/${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}/SHA256SUMS.txt)
            
            ### 架构与运行环境 (Architecture Scope)
            - **操作系统**: Windows 10 / Windows 11 (仅限 64 位 x64 / AMD64)
            - **32位宿主 (x86/WOW64)**: 目前未包含 32 位二进制，不支持 32 位宿主应用。
            
            ### 安装与启用说明 (How to Install & Enable)
            1. **方式 A (安装包推荐)**:
               - 点击上方链接下载并运行 `PersonalIME-Setup-x64.exe`，按安装向导完成安装。
               - 在 Windows“设置 -> 时间和语言 -> 语言和区域 -> 键盘”中可选用“人人 (RenRen IME)”。
            2. **方式 B (绿色便携免安装)**:
               - 解压 `PersonalIME-v${{ env.RELEASE_VERSION }}-portable-x64.zip` 到任意目录。
               - 双击根目录下 `start.bat`（首次运行会自动请求管理员权限注册系统 TSF 输入法驱动并启动后台服务）。
               - 随时可运行根目录下 `stop.bat` 彻底注销系统驱动并停止服务。
            
            ### 代码签名说明 (Code Signing Status)
            > [!WARNING]
            > 本项目为开源构建产物，尚未附加商业数字签名证书。Windows SmartScreen 下载或首次运行时可能提示“未知发布者”，点击“更多信息” -> “仍要运行”即可。

  package-macos:
    name: Package macOS DMG & Publish
    needs: [ build-and-test-macos, package-and-release ]
    runs-on: macos-latest
    # Only package on push to main, tag push, or manual workflow_dispatch
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Version
        id: get_version
        shell: bash
        run: |
          ver=""
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            ver="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            shortSha="${GITHUB_SHA:0:7}"
            dateStr="$(date +%Y%m%d)"
            ver="1.0.0-ci.${dateStr}.${shortSha}"
          fi
          echo "Resolved Target Version: ${ver}"
          echo "RELEASE_VERSION=${ver}" >> "${GITHUB_ENV}"
          echo "version=${ver}" >> "${GITHUB_OUTPUT}"

      - name: Configure CMake (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build macOS Input Method Bundle
        run: cmake --build build --config Release --parallel

      - name: Verify Bundle
        run: |
          test -f build/PersonalIME.app/Contents/PkgInfo
          test "$(cat build/PersonalIME.app/Contents/PkgInfo)" = "APPL????"
          codesign --verify --verbose build/PersonalIME.app
          /usr/libexec/PlistBuddy -c "Print :InputMethodConnectionName" build/PersonalIME.app/Contents/Info.plist

      - name: Create DMG
        run: |
          mkdir -p out/release
          DMG="out/release/PersonalIME-macOS-v${{ env.RELEASE_VERSION }}.dmg"
          hdiutil create -volname "PersonalIME" -srcfolder build/PersonalIME.app \
            -ov -format UDZO "${DMG}"
          echo "DMG_PATH=${DMG}" >> "${GITHUB_ENV}"
          shasum -a 256 "${DMG}" > out/release/SHA256SUMS-macOS.txt
          cat out/release/SHA256SUMS-macOS.txt

      - name: Upload macOS DMG to CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PersonalIME-macOS-v${{ env.RELEASE_VERSION }}
          path: |
            ${{ env.DMG_PATH }}
            out/release/SHA256SUMS-macOS.txt
          retention-days: 30

      - name: Attach macOS DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}
          files: |
            ${{ env.DMG_PATH }}
            out/release/SHA256SUMS-macOS.txt
